<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Other Courses</title>
  <style>
    :root{
      --ink:#12262a;
      --teal:#1f3a3d;
      --paper:#f7f2e7;
      --surface:#ffffff;
      --line: rgba(18,38,42,0.14);
      --rust:#b5533c;
      --radius:14px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC","PingFang TC","Heiti TC",sans-serif;
      background:var(--paper);
      color:var(--ink);
      line-height:1.7;
    }
    .wrap{max-width:980px;margin:0 auto;padding:40px 20px 64px}
    h1{margin:0 0 18px;font-size:clamp(1.8rem,4vw,2.6rem);color:var(--teal);}
    .sub{margin:0 0 28px;color:#4b5f5c}
    .list{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
      gap:14px;
      padding:0;
      list-style:none;
      margin:0;
    }
    .card{
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:18px 16px;
      box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 20px rgba(0,0,0,.05);
      transition:transform .15s ease, border-color .15s ease;
    }
    .card:hover{transform:translateY(-1px); border-color:rgba(181,83,60,0.3)}
    .card a{display:block; color:inherit; text-decoration:none;}
    .card h2{margin:0;font-size:1.05rem;color:var(--rust);}
    .top-link{
      display:inline-block;
      margin-bottom:20px;
      color:var(--rust);
      text-decoration:none;
      font-weight:600;
    }
    .top-link:hover{text-decoration:underline}
  </style>
</head>
<body>
  <div class="wrap">
    <a class="top-link" href="index.html">← Back to Home</a>
    <h1>Other Courses</h1>
    <p class="sub">課程與教材導覽</p>

      <li class="card"><a href="Marketing syllabus map.html"><h2>2. Marketing syllabus map</h2></a></li>
      <li class="card"><a href="Travel management map.html"><h2>3. Travel management map</h2></a></li>
      <li class="card"><a href="Media pr_practice map.html"><h2>4. Media pr_practice map</h2></a></li>
      <li class="card"><a href="Mice advanced management map.html"><h2>5. Mice advanced management map</h2></a></li>
      <li class="card"><a href="Economics syllabus map.html"><h2>6. Economics syllabus map</h2></a></li>
    </ul>
  </div>
</body>
</html>
